<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHGo!</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #000;
    }

    /* ===== NAVBAR (Two-Tier) ===== */
    .navbar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Top bar – logo only */
    .nav-top {
      background-color: #08082b;
      padding: 16px 30px;


      display: flex;
      justify-content: center;
      /* ✅ center horizontally */
      align-items: center;

    }

    .nav-top .logo {
      color: rgb(229, 228, 213);
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Bottom bar – links */
    .nav-bottom {
      background-color: #15151a;
      padding: 12px 30px;
      border-top: 1px solid #ffffff;
    }

    .nav-bottom ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .nav-bottom ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-bottom ul li a:hover {
      color: #08082b;
    }

    /* ===== HERO SECTION ===== */
    .hero {
      flex: 1;
      min-height: 80vh;

      background:
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url("https://www.debevoisedatablog.com/wp-content/uploads/sites/2/2020/10/GettyImages-1166552380-scaled.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-content h1 {
      font-size: 54px;
      color: white;
      margin-bottom: 20px;
    }

    .hero-content p {
      font-size: 20px;
      color: #e8e8e8;
      margin-bottom: 35px;
    }

    /* Button */
    .hero-content button {
      padding: 14px 42px;
      font-size: 18px;
      font-weight: bold;
      background-color: #1d3fd6;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .hero-content button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45);
    }

    /* ===== FOOTER ===== */
    footer {
      background-color: #15151a;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>



<script>
  //script that sends http request
  //pageKey is the string that is sent to go
  async function navigate(event, pageKey) {
    event.preventDefault();

    //sends a get request to go handler with page key as parameter
    try {
      const res = await fetch(`/view?page=${pageKey}`, {
        method: "GET",
        //makes sure session cookie is attached to go can identify the user and check their role against the page's security level
        credentials: "include"
      });

      //if Go redirects the request, this catches it and moves the browser to the redirect URL
      //ie sending unauthorized user to login
      if (res.redirected) {
        window.location.href = res.url;
        return;
      }
      //successful response
      if (res.ok) {
        window.location.href = res.url;
      }
      //if go returns 401 (not logged in or 403(logged in but wrong role))
      //browser sent back to login page
      else if (res.status === 401 || res.status === 403) {
        window.location.href = "/navigate?page=login";
      } else {
        console.error(`Navigation to ${pageKey} failed with status: ${res.status}`);
      }

    } catch (err) {
      console.error("Navigation error:", err);
    }
  }
</script>

<body>

  <nav class="navbar">

    <!-- TOP BAR -->
    <div class="nav-top">
      <div class="logo">OHGo!</div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="nav-bottom">
      <ul>
        <li><a href="/view/home">Home</a></li>
        <li><a href="/profile/grid/null">Bios</a></li>
        <li><a href="/view/calendar">Calendar</a></li>
        <li><a href="/view/requests">Request</a></li>
        <li><a href="/view/admin">Admins</a></li>
        <li><a href="/view/tas">TAs</a></li>
        <li><a href="/view/about">About</a></li>
      </ul>
    </div>

  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to OHGo!</h1>
      <p>Access your office hours, anytime.</p>
      <button onclick="location.href='/view/login'">Login</button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 OHGo! All rights reserved (this is a lie).</p>
  </footer>

</body>

</html>
