<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHGo!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* NAVBAR */
    nav {
      background-color: #181b73;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: rgb(229, 228, 213);
      font-size: 24px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
    }

    /* HERO SECTION[overall background] */
    .hero {
      background-color: #f0f0f0;
      text-align: center;
      padding: 100px 20px;
      flex: 1;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #555;
    }

    .hero button {
      padding: 12px 30px;
      font-size: 16px;
      background-color: #4b4242;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    /* FOOTER */
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>



<script>
  //script that sends http request
  //pageKey is the string that is sent to go
  async function navigate(event, pageKey) {
    event.preventDefault();

    //sends a get request to go handler with page key as parameter
    try {
      const res = await fetch(`/navigate?page=${pageKey}`, {
        method: "GET",
        //makes sure session cookie is attached to go can identify the user and check their role against the page's security level
        credentials: "include"
      });

      //if Go redirects the request, this catches it and moves the browser to the redirect URL
      //ie sending unauthorized user to login
      if (res.redirected) {
        window.location.href = res.url;
        return;
      }
      //successful response
      if (res.ok) {
        window.location.href = res.url;
      }
      //if go returns 401 (not logged in or 403(logged in but wrong role))
      //browser sent back to login page
       else if (res.status === 401 || res.status === 403) {
        window.location.href = "/navigate?page=login";
      } else {
        console.error(`Navigation to ${pageKey} failed with status: ${res.status}`);
      }

    } catch (err) {
      console.error("Navigation error:", err);
    }
  }
</script>

<body>

  <!-- NAVBAR STUFF -->
  <nav>
  <div class="logo">OHGo!</div>
  <ul>
    <li><a href="frontPage.html" onclick="navigate(event, '/home')">Home</a></li>
    <li><a href="profiles.html" onclick="navigate(event, '/bios')">Bios</a></li>
    <li><a href="calendar.html" onclick="navigate(event, '/calendar')">Calendar</a></li>
    <li><a href="admin.html" onclick="navigate(event, '/admins')">Admins</a></li>
    <li><a href="TAs.html" onclick="navigate(event, '/tas')">TAs</a></li>
    <li><a href="about.html" onclick="navigate(event, '/about')">About</a></li>
  </ul>
</nav>

  <!-- HERO SECTION -->
  <div class="hero">
    <h1>Welcome to OHGo!</h1>
    <p>Access your office hours, anytime.</p>
    <a href = "login.html"><button>Login</button></a>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 OHGo!. All rights reserved.</p>
  </footer>

</body>

</html>
