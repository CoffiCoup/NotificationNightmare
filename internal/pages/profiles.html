<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* NAVBAR */
    nav {
      background-color: #1c1f81;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* NAVBAR */
    nav {
      background-color: #1c1f81;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: rgb(229, 228, 213);
      font-size: 24px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
    }
  

    h2 {
      text-align: center;
      padding: 40px 20px 20px;
      font-size: 32px;
    }

    /* THE GRID OF PROFILES */
    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* EACH PROFILE CARD */
    .profile-card {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .profile-card:hover {
      transform: scale(1.05);
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .profile-card p {
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">OHGo!</div>
    <ul>
      <li><a href="frontPage.html">Home</a></li>
      
      <li><a href="profiles.html">Bios</a></li>
      <li><a href="calendarPage.html">Calendar</a></li>
       <li><a href="admin.html">Admins</a></li>
       <li><a href="TAs.html">TAs</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <h2>Meet Everyone</h2>

  <div class="profiles-grid">

    <!-- EACH CARD LINKS TO THAT PERSON'S PAGE -->
    <a href="profile.html" style="text-decoration: none;">
      <div class="profile-card">
        <img src="photo.jpg" alt="ethan">
        <p>ethan</p>
      </div>
    </a>

    <a href="profile.html" style="text-decoration: none;">
      <div class="profile-card">
        <img src="photo.jpg" alt="luke">
        <p>luke</p>
      </div>
    </a>

  </div>

</body>
</html>
