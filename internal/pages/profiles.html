<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;

      font-family: Georgia, sans-serif;
      background: url("https://www.debevoisedatablog.com/wp-content/uploads/sites/2/2020/10/GettyImages-1166552380-scaled.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    main {
      flex: 1;
    }

    h2 {
      color: white;
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
      font-size: 36px;
    }



    /* NAVBAR */
    .navbar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Top bar – logo only */
    .nav-top {
      background-color: #08082b;
      padding: 16px 30px;
    }

    .nav-top .logo {
      color: rgb(229, 228, 213);
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Bottom bar – links */
    .nav-bottom {
      background-color: #15151a;
      padding: 12px 30px;
      border-top: 1px solid #ffffff;
    }

    .nav-bottom ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .nav-bottom ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-bottom ul li a:hover {
      color: #08082b;
    }


    /* THE GRID OF PROFILES */
    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* EACH PROFILE CARD */
    .profile-card {
      background-color: #08082b;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .profile-card:hover {
      transform: scale(1.05);
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .profile-card p {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    footer {
      background-color: #15151a;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>

  <nav>
    <div class="logo">OHGo!</div>
    <ul>
      <li><a href="/view/home">Home</a></li>
      <li><a href="/view/profiles">Bios</a></li>
      <li><a href="/view/calendar">Calendar</a></li>
      <li><a href="/view/admin">Admins</a></li>
      <li><a href="/view/tas">TAs</a></li>
      <li><a href="/view/about">About</a></li>
    </ul>
  </nav>

  <h2>Meet Everyone</h2>

  <div class="profiles-grid">

    <!-- EACH CARD LINKS TO THAT PERSON'S PAGE -->
    <a href="profile.html" style="text-decoration: none;">
      <div class="profile-card">
        <img src="photo.jpg" alt="ethan">
        <p>ethan</p>
      </div>
    </a>

    <a href="profile.html" style="text-decoration: none;">
      <div class="profile-card">
        <img src="photo.jpg" alt="luke">
        <p>luke</p>
      </div>
    </a>

  </div>

</body>

</html>
