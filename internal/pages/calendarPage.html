<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--this is the stuff that connects to FullCalendar library-->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <title>Bio Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* NAVBAR */
    nav {
      background-color: #1c1f81;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: rgb(229, 228, 213);
      font-size: 24px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
    }

    h2 {
      text-align: center;
      padding: 40px 20px 20px;
      font-size: 32px;
    }

    iframe{
      width: 100vw;
      height: 80vh;
      aspect-ratio: 16/9;

    }
  </style>
</head>
<body>
  


  <!-- NAVBAR STUFF -->
  <nav>
    <div class="logo">OHGo!</div>
    <ul>
      <li><a href="/view/home">Home</a></li>
      <li><a href="/view/profiles">Bios</a></li>
      <li><a href="/view/calendar">Calendar</a></li>
      <li><a href="/view/admin">Admins</a></li>
      <li><a href="/view/tas">TAs</a></li>
      <li><a href="/view/about">About</a></li>
    </ul>
  </nav>

  <!--content-->
<div class="hero">
    <h1>TA Office Hours Calendar</h1>
    <div id="calendar" style="max-width: 900px; margin: 40px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);"></div>
</div>
  
  <!--script that fetches the json file and maps it to the calendar: source FullCalendar.io (an open source calendar)-->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listWeek'
        },
        // Change the colors to match OHGo! Navy
        eventColor: '#1c1f81',
        eventTextColor: '#ffffff',

        // This is where you link your backend JSON file
        events: function(fetchInfo, successCallback, failureCallback) {
            fetch('../../officehours.json') // Replace with your actual file path or API URL
                .then(response => response.json())
                .then(data => {
                    // Map your backend data to FullCalendar's format
                    const events = data.map(item => ({
                      title: `${item.ta_name} - ${item.location}`,
                      start: `${item.day}T${item.start_time}`,
                      end: `${item.day}T${item.end_time}`,
                      extendedProps: {
                          location: item.location
                      }
                  }));
                    successCallback(events);
                })
                .catch(error => {
                    console.error('Error loading JSON:', error);
                    failureCallback(error);
                });
        },
        eventClick: function(info) {
            alert('Office Hours with ' + info.event.title);
        }
    });

    calendar.render();
});
  </script>
  


</body>
</html>
