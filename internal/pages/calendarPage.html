<head>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <title>Bio Page</title>
  <style>
    * {

      padding: 0;
      box-sizing: border-box;

    body {
      font-family: Georgia, sans-serif;
      background-color: #08082b;

    /* NAVBAR */
    .navbar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Top bar – logo only */
    .nav-top {
      background-color: #08082b;
      padding: 16px 30px;

      display: flex;
      justify-content: center;
      /* centers horizontally */
      align-items: center;
      /* centers vertically */
    }



    .nav-top .logo {
      color: rgb(229, 228, 213);
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Bottom bar – links */
    .nav-bottom {
      background-color: #15151a;
      padding: 12px 30px;
      border-top: 1px solid #ffffff;
    }

    .nav-bottom ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .nav-bottom ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;

    }

    h1 {
      color: rgb(255, 255, 255);
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
      font-size: 36px;
    }

    h2 {
      text-align: center;
      padding: 40px 20px 20px;
      font-size: 32px;
    }

    iframe {
      width: 100vw;
      height: 80vh;
      aspect-ratio: 16/9;

    }
  </style>
</head>

<body>



  <!-- NAVBAR STUFF -->
  <nav class="navbar">
    <!-- TOP BAR: LOGO ONLY -->
    <div class="nav-top">
      <div class="logo">OHGo!</div>
    </div>


    <!-- BOTTOM BAR: NAV LINKS -->
    <div class="nav-bottom">
      <ul>
        <li><a href="frontPage.html">Home</a></li>
        <li><a href="profiles.html">Bios</a></li>
        <li><a href="calendarPage.html">Calendar</a></li>
        <li><a href="admin.html">Admins</a></li>
        <li><a href="TAs.html">TAs</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
  </nav>

  <!--content-->
  <div class="hero">
    <h1>TA Office Hours Calendar</h1>
    <div id="calendar"
      style="max-width: 900px; margin: 40px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    </div>
  </div>

  <!--script that fetches the json file and maps it to the calendar: source FullCalendar.io (an open source calendar)-->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,listWeek'
        },
        // Change the colors to match OHGo! Navy
        eventColor: '#1c1f81',
        eventTextColor: '#ffffff',

        // This is where you link your backend JSON file
        events: function (fetchInfo, successCallback, failureCallback) {
          fetch('../../officehours.json') // Replace with your actual file path or API URL
            .then(response => response.json())
            .then(data => {
              // Map your backend data to FullCalendar's format
              const events = data.map(item => ({
                title: `${item.ta_name} - ${item.location}`,
                start: `${item.day}T${item.start_time}`,
                end: `${item.day}T${item.end_time}`,
                extendedProps: {
                  location: item.location
                }
              }));
              successCallback(events);
            })
            .catch(error => {
              console.error('Error loading JSON:', error);
              failureCallback(error);
            });
        },
        eventClick: function (info) {
          alert('Office Hours with ' + info.event.title);
        }
      });

      calendar.render();
    });
  </script>



</body>

</html>
