<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Name }} </title>
  <style>
    /* NAVBAR */
    .navbar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-top {
      background-color: #08082b;
      padding: 16px 30px;


      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-top .logo {
      color: rgb(229, 228, 213);
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .nav-bottom {
      background-color: #15151a;
      padding: 12px 30px;
      border-top: 1px solid #ffffff;
    }

    .nav-bottom ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .nav-bottom ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-bottom ul li a:hover {
      color: #aaaaaa;
    }

    /* BASIC RESET */
    body {
      margin: 0;
      font-family: Georgia, sans-serif;
    }

    /* PAGE BACKGROUND */
    main {
      min-height: calc(100vh - 140px);
      background:
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url("https://www.debevoisedatablog.com/wp-content/uploads/sites/2/2020/10/GettyImages-1166552380-scaled.jpg");

      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      padding: 80px 20px;
    }

    /* CENTERED CONTENT BOX */
    .profile-container {
      max-width: 900px;
      width: 100%;
      color: white;
    }

    /* IMAGE + BIO LAYOUT */
    .profile-body {
      display: flex;
      gap: 40px;
      margin-top: 30px;
      align-items: flex-start;
    }

    .pfp {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .profile-text p {
      line-height: 1.6;
      margin-bottom: 14px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-top">
      <div class="logo">OHGo!</div>
    </div>
    <div class="nav-bottom">
      <ul>
        <li><a href="/view/home">Home</a></li>
        <li><a href="/profile/grid/null">Bios</a></li>
        <li><a href="/view/calendar">Calendar</a></li>
        <li><a href="/view/requests">Request</a></li>
        <li><a href="/view/admin">Admins</a></li>
        <li><a href="/view/tas">TAs</a></li>
        <li><a href="/view/about">About</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="profile-container">
      <h1>{{ .Name }}</h1>
      <p><strong>{{ .Title }}</strong></p>
      <p>{{ .Email }}</p>

      <div class="profile-body">
        <img src="{{ .PhotoURL }}" class="pfrofile-text">
        <p>{{ .Bio }}</p>
      </div>
    </div>
    </div>
  </main>

</body>

</html>
