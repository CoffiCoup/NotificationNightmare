<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — User Management</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:    #1c1f81;
      --navy-dk: #13165e;
      --navy-lt: #2d31b3;
      --cream:   #e5e4d5;
      --red:     #c0392b;
      --red-dk:  #96281b;
      --green:   #1a7a4a;
      --green-lt:#e6f4ee;
      --grey:    #f0f0ec;
      --border:  #d4d4c8;
      --text:    #1a1a2e;
      --muted:   #666670;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--grey);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Navbar ── */
    nav {
      background: var(--navy);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo { color: var(--cream); font-size: 24px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
    nav ul { list-style: none; display: flex; gap: 20px; }
    nav ul li a { color: #fff; text-decoration: none; font-size: 14px; }
    nav ul li a:hover { color: var(--cream); }

    /* ── Page header ── */
    .page-header {
      background: var(--navy);
      color: #fff;
      padding: 28px 40px 24px;
      border-bottom: 3px solid var(--navy-lt);
    }
    .page-header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--cream);
    }
    .page-header p { font-size: 13px; color: #9fa3d4; margin-top: 4px; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .toolbar-left { display: flex; gap: 10px; align-items: center; }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { background: var(--navy-lt); }
    .btn-danger  { background: var(--red);   color: #fff; }
    .btn-danger:hover  { background: var(--red-dk); }
    .btn-ghost   { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
    .btn-ghost:hover { background: var(--navy); color: #fff; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    #search-input {
      padding: 8px 14px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
      width: 220px;
      outline: none;
    }
    #search-input:focus { border-color: var(--navy); }

    /* ── Table ── */
    .table-wrap {
      padding: 24px 40px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(28,31,129,0.08);
    }

    thead tr {
      background: var(--navy);
      color: var(--cream);
    }
    thead th {
      padding: 14px 18px;
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
      animation: rowIn 0.25s ease both;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f5f5fb; }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    td {
      padding: 13px 18px;
      font-size: 14px;
      vertical-align: middle;
    }

    td.uid-cell {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--navy);
    }
    td.pw-cell {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    /* Role badges */
    .role-badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.04em;
    }
    .badge-0 { background: #1c1f81; color: #fff; }          /* Admin  */
    .badge-1 { background: #2c5f8a; color: #fff; }          /* Staff  */
    .badge-2 { background: #1a7a4a; color: #fff; }          /* TA     */
    .badge-3 { background: #7a5c1a; color: #fff; }          /* Student*/
    .badge-4 { background: #555;    color: #fff; }          /* Guest  */

    .actions { display: flex; gap: 6px; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Modal base ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,10,40,0.55);
      z-index: 9000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      padding: 32px 30px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.22);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn {
      from { opacity:0; transform: scale(0.95) translateY(10px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }

    .modal-box h3 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      color: var(--navy);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--grey);
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-family: 'IBM Plex Mono', monospace;
    }
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      font-size: 14px;
      font-family: 'IBM Plex Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: var(--navy); }

    /* Role checkboxes */
    .role-checks { display: flex; flex-direction: column; gap: 8px; }
    .role-check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .role-check-item:hover { background: var(--grey); }
    .role-check-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--navy); }
    .role-check-item .role-label { font-size: 13px; font-weight: 500; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* ── Confirm modal ── */
    #confirm-modal .modal-box { max-width: 360px; text-align: center; }
    #confirm-modal .modal-box p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 26px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      z-index: 10000;
      display: none;
      font-family: 'IBM Plex Sans', sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      animation: fadeUp 0.3s ease;
    }
    #toast.success { background: var(--green);  display: block; }
    #toast.error   { background: var(--red);    display: block; }
    @keyframes fadeUp {
      from { opacity:0; transform: translateX(-50%) translateY(10px); }
      to   { opacity:1; transform: translateX(-50%) translateY(0); }
    }

    .user-count {
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo">OHGo!</div>

    <div class="nav-bottom">
  <ul>
    <li><a href="/view/home">Home</a></li>
    <li><a href="/view/profiles">Bios</a></li>
    <li><a href="/view/calendar">Calendar</a></li>
    <li><a href="/view/admin">Admins</a></li>
    <li><a href="/view/tas">TAs</a></li>
    <li><a href="/view/about">About</a></li>
  </ul>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>// USER MANAGEMENT</h1>
    <p>Manage UIDs, passwords, and role assignments stored in roleList.json</p>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
  <div class="toolbar-left">
    <button class="btn btn-primary" onclick="openAddModal()">+ Add User</button>
    <input type="text" id="search-input" placeholder="Search by UID or role..." oninput="renderTable()">
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span class="user-count" id="user-count"></span>
    <button class="btn btn-ghost btn-sm" onclick="discardChanges()">Discard</button>
    <button class="btn btn-primary btn-sm" id="save-btn" onclick="saveChanges()">Save Changes</button>
  </div>
</div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table id="user-table">
      <thead>
        <tr>
          <th>UID</th>
          <th>Password</th>
          <th>Roles</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- ── EDIT / ADD MODAL ── -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <h3 id="modal-title">Edit User</h3>

      <div class="form-group">
        <label>UID</label>
        <input type="text" id="field-uid" placeholder="e.g. 001">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="text" id="field-password" placeholder="Password">
      </div>

      <div class="form-group">
        <label>Roles</label>
        <div class="role-checks">
          <label class="role-check-item"><input type="checkbox" value="0"> <span class="role-label">0 — Admin</span></label>
          <label class="role-check-item"><input type="checkbox" value="1"> <span class="role-label">1 — Staff</span></label>
          <label class="role-check-item"><input type="checkbox" value="2"> <span class="role-label">2 — TA</span></label>
          <label class="role-check-item"><input type="checkbox" value="3"> <span class="role-label">3 — Student</span></label>
          <label class="role-check-item"><input type="checkbox" value="4"> <span class="role-label">4 — Guest</span></label>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser()">Save</button>
      </div>
    </div>
  </div>

  <!-- ── CONFIRM DELETE MODAL ── -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
      <h3>Delete User?</h3>
      <p id="confirm-msg">Are you sure you want to delete this user? This cannot be undone.</p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-ghost" onclick="closeConfirmModal()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <script>
  // ── Role map ──────────────────────────────────────────────────
  const ROLE_NAMES = { 0: 'Admin', 1: 'Staff', 2: 'TA', 3: 'Student', 4: 'Guest' };

  // ── State ─────────────────────────────────────────────────────
  let users        = [];   // master list loaded from backend
  let upserts      = [];   // [0]: new + edited entries
  let deletions    = [];   // [1]: entries to delete
  let editingUid   = null; // null = adding new, string = editing existing
  let pendingDeleteUid = null;

  // ── Toast ─────────────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = type;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = ''; }, 3500);
  }

  // ── Load users from backend ───────────────────────────────────
  async function loadUsers() {
    try {
      const res = await fetch('/fetch/rolelist');
      if (!res.ok) throw new Error(res.statusText);
      users = await res.json();
      upserts   = [];
      deletions = [];
      renderTable();
      updateSaveBtn();
    } catch (err) {
      console.error(err);
      showToast('Failed to load user data.', 'error');
    }
  }

  // ── Render table ──────────────────────────────────────────────
  function renderTable() {
    const query = document.getElementById('search-input').value.trim().toLowerCase();
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    // Build the current working view: start from users, apply upserts, remove deletions
    const deletedUids = new Set(deletions.map(d => d.Uid));
    const upsertMap   = new Map(upserts.map(u => [u.Uid, u]));

    let working = users
      .filter(u => !deletedUids.has(u.Uid))
      .map(u => upsertMap.has(u.Uid) ? upsertMap.get(u.Uid) : u);

    // Add brand-new entries (in upserts but not in original users)
    const existingUids = new Set(users.map(u => u.Uid));
    upserts.forEach(u => {
      if (!existingUids.has(u.Uid)) working.push(u);
    });

    // Filter by search
    const filtered = working.filter(u => {
      if (!query) return true;
      const roleNames = u.Roles.map(r => ROLE_NAMES[r]?.toLowerCase() || '').join(' ');
      return u.Uid.toLowerCase().includes(query) || roleNames.includes(query);
    });

    document.getElementById('user-count').textContent =
      `${filtered.length} of ${working.length} users`;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">No users found.</div></td></tr>`;
      return;
    }

    filtered.forEach((user, i) => {
      const tr = document.createElement('tr');
      tr.style.animationDelay = `${i * 40}ms`;

      // Mark rows with pending changes
      const isPendingEdit   = upsertMap.has(user.Uid);
      const isPendingNew    = isPendingEdit && !existingUids.has(user.Uid);
      if (isPendingNew)  tr.style.background = '#eef6f1';
      if (isPendingEdit && !isPendingNew) tr.style.background = '#f0f0fb';

      const badges = user.Roles.map(r =>
        `<span class="badge badge-${r}">${ROLE_NAMES[r] ?? r}</span>`
      ).join('');

      const pendingTag = isPendingNew
        ? `<span style="font-size:10px;color:#1a7a4a;font-family:'IBM Plex Mono',monospace;margin-left:6px;">NEW</span>`
        : isPendingEdit
        ? `<span style="font-size:10px;color:#2d31b3;font-family:'IBM Plex Mono',monospace;margin-left:6px;">EDITED</span>`
        : '';

      tr.innerHTML = `
        <td class="uid-cell">${escHtml(user.Uid)}${pendingTag}</td>
        <td class="pw-cell">${escHtml(user.Password)}</td>
        <td><div class="role-badges">${badges}</div></td>
        <td>
          <div class="actions">
            <button class="btn btn-ghost btn-sm" onclick="openEditModal('${escHtml(user.Uid)}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="openDeleteConfirm('${escHtml(user.Uid)}')">Delete</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Show/hide Save button badge with pending count
  function updateSaveBtn() {
    const btn = document.getElementById('save-btn');
    const total = upserts.length + deletions.length;
    btn.textContent = total > 0 ? `💾 Save Changes (${total} pending)` : '💾 Save Changes';
    btn.disabled = total === 0;
    btn.style.opacity = total === 0 ? '0.5' : '1';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Edit / Add modal ──────────────────────────────────────────
  function openAddModal() {
    editingUid = null;
    document.getElementById('modal-title').textContent = 'Add User';
    document.getElementById('field-uid').value = '';
    document.getElementById('field-uid').disabled = false;
    document.getElementById('field-password').value = '';
    document.querySelectorAll('.role-checks input[type=checkbox]')
      .forEach(cb => cb.checked = false);
    document.getElementById('edit-modal').classList.add('open');
  }

  function openEditModal(uid) {
    // Resolve from working state (may be a pending upsert)
    const upsertMap  = new Map(upserts.map(u => [u.Uid, u]));
    const user = upsertMap.get(uid) || users.find(u => u.Uid === uid);
    if (!user) return;
    editingUid = uid;

    document.getElementById('modal-title').textContent = `Edit — ${uid}`;
    document.getElementById('field-uid').value = user.Uid;
    document.getElementById('field-uid').disabled = true; // UID is the key; don't allow rename
    document.getElementById('field-password').value = user.Password;

    document.querySelectorAll('.role-checks input[type=checkbox]').forEach(cb => {
      cb.checked = user.Roles.includes(Number(cb.value));
    });

    document.getElementById('edit-modal').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editingUid = null;
  }

  function saveUser() {
    const uid      = document.getElementById('field-uid').value.trim();
    const password = document.getElementById('field-password').value.trim();
    const roles    = [...document.querySelectorAll('.role-checks input[type=checkbox]')]
                      .filter(cb => cb.checked)
                      .map(cb => Number(cb.value));

    if (!uid)            { showToast('UID cannot be empty.', 'error'); return; }
    if (roles.length === 0) { showToast('Select at least one role.', 'error'); return; }

    const isNew = editingUid === null;

    if (isNew) {
      // Check for duplicate in current working state
      const deletedUids  = new Set(deletions.map(d => d.Uid));
      const existingUids = new Set([
        ...users.map(u => u.Uid),
        ...upserts.map(u => u.Uid)
      ].filter(id => !deletedUids.has(id)));

      if (existingUids.has(uid)) {
        showToast(`UID "${uid}" already exists.`, 'error');
        return;
      }
    }

    const entry = { Uid: uid, Password: password, Roles: roles };

    // Remove any prior upsert for this UID, then push updated entry
    upserts = upserts.filter(u => u.Uid !== uid);
    upserts.push(entry);

    // If this was previously queued for deletion, un-delete it
    deletions = deletions.filter(d => d.Uid !== uid);

    renderTable();
    updateSaveBtn();
    closeEditModal();
    showToast(isNew ? `"${uid}" staged for addition.` : `"${uid}" staged for update.`, 'success');
  }

  // ── Delete ────────────────────────────────────────────────────
  function openDeleteConfirm(uid) {
    pendingDeleteUid = uid;
    document.getElementById('confirm-msg').textContent =
      `Are you sure you want to delete user "${uid}"? Click Save Changes to commit.`;
    document.getElementById('confirm-modal').classList.add('open');
  }

  function closeConfirmModal() {
    document.getElementById('confirm-modal').classList.remove('open');
    pendingDeleteUid = null;
  }

  function confirmDelete() {
    if (!pendingDeleteUid) return;
    const uid = pendingDeleteUid;
    closeConfirmModal();

    // Stage deletion: remove from upserts, add to deletions
    upserts   = upserts.filter(u => u.Uid !== uid);
    const existing = users.find(u => u.Uid === uid);
    if (existing && !deletions.find(d => d.Uid === uid)) {
      deletions.push(existing);
    }

    renderTable();
    updateSaveBtn();
    showToast(`"${uid}" staged for deletion.`, 'success');
  }

  // ── Commit all changes to backend ────────────────────────────
  // Payload shape: [ upserts[], deletions[] ]  → matches [][]auth.RoleEntry
  async function saveChanges() {
    if (upserts.length === 0 && deletions.length === 0) return;

    const payload = [upserts, deletions];

    try {
      const res = await fetch('/admin/updateroles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        showToast('All changes saved successfully.', 'success');
        await loadUsers(); // reload clean from backend
      } else {
        const txt = await res.text();
        showToast(`Save failed: ${txt || res.statusText}`, 'error');
        // Attempt restore on backend failure
        await fetch('/admin/restoreroles', { method: 'POST' });
      }
    } catch (err) {
      console.error(err);
      showToast('Network error — changes not saved.', 'error');
    }
  }

  // ── Discard all pending changes ───────────────────────────────
  function discardChanges() {
    upserts   = [];
    deletions = [];
    renderTable();
    updateSaveBtn();
    showToast('Pending changes discarded.', 'success');
  }

  // Close modals on backdrop click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) {
        overlay.classList.remove('open');
        editingUid = null;
        pendingDeleteUid = null;
      }
    });
  });

  // ── Init ──────────────────────────────────────────────────────
  loadUsers();
</script>

    
</body>
</html>
