<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }



        h1 {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-card {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.25rem;
            margin-top: 1rem;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .btn {
            margin-top: 1.5rem;
            padding: 0.6rem 1.5rem;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background: #0052a3;
        }

        .btn-delete {
            background: #cc0000;
            margin-top: 0.75rem;
        }

        .btn-delete:hover {
            background: #a30000;
        }

        #message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }


        /* ===== NAVBAR (Two-Tier) ===== */
        .navbar {
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Top bar – logo only */
        .nav-top {
            background-color: #08082b;
            padding: 16px 30px;


            display: flex;
            justify-content: center;
            /* ✅ center horizontally */
            align-items: center;

        }

        .nav-top .logo {
            color: rgb(229, 228, 213);
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Bottom bar – links */
        .nav-bottom {
            background-color: #15151a;
            padding: 12px 30px;
            border-top: 1px solid #ffffff;
        }

        .nav-bottom ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 28px;
        }

        .nav-bottom ul li a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-bottom ul li a:hover {
            color: #08082b;
        }


        h2 {
            text-align: center;
            padding: 40px 20px 20px;
            font-size: 32px;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <!-- TOP BAR -->
        <div class="nav-top">
            <div class="logo">OHGo!</div>
        </div>

        <!-- BOTTOM BAR -->
        <div class="nav-bottom">
            <ul>
                <li><a href="/view/home">Home</a></li>
                <li><a href="/profile/grid/null">Bios</a></li>
                <li><a href="/view/calendar">Calendar</a></li>
                <li><a href="/view/requests">Request</a></li>
                <li><a href="/view/admin">Admins</a></li>
                <li><a href="/view/tas">TAs</a></li>
                <li><a href="/view/about">About</a></li>
            </ul>
        </div>

    </nav>



    <h1>TA Dashboard</h1>
    <p class="subtitle">Create or update your profile. It will appear on the public profiles page.</p>

    <div class="form-card">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your full name" value="{{ .Name }}">

        <label for="title">Title</label>
        <select id="title">
            <option value="TA" {{ if eq .Title "TA" }}selected{{ end }}>TA</option>
            <option value="Professor" {{ if eq .Title "Professor" }}selected{{ end }}>Professor</option>
        </select>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@virginia.edu" value="{{ .Email }}">

        <label for="photo_url">Select an image:</label>
        <input type="file" id="photo_url" value="{{ .PhotoURL }}" accept=".jpg, .jpeg, .png">

        <label for="bio">Bio</label>
        <textarea id="bio" placeholder="Tell students about yourself...">{{ .Bio }}</textarea>

        <button class="btn" onclick="saveBio()">Save Profile</button>
        {{ if .ID }}
        <button class="btn btn-delete" onclick="deleteBio()">Delete Profile</button>
        {{ end }}

        <div id="message"></div>


    </div>

    <script>
        async function saveBio() {
            const bio = {
                name: document.getElementById('name').value.trim(),
                title: document.getElementById('title').value,
                email: document.getElementById('email').value.trim(),
                photo_url: document.getElementById('photo_url').files[0]
                    ? document.getElementById('photo_url').files[0].name
                    : '{{ .PhotoURL }}',
                bio: document.getElementById('bio').value.trim(),
            }

            if (!bio.name || !bio.email) {
                showMessage('Name and email are required.', false)
                return
            }

            try {
                // ← correct route for your router
                const resp = await fetch('/profile/upsert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bio)
                })

                if (resp.ok) {
                    showMessage('Profile saved! It is now visible on the profiles page.', true)
                } else if (resp.status === 401 || resp.status === 403) {
                    showMessage('You must be logged in as a TA to save a profile.', false)
                } else {
                    const text = await resp.text()
                    showMessage(`Something went wrong: ${text}`, false)
                }
            } catch (err) {
                showMessage('Network error. Is the server running?', false)
            }
        }

        async function deleteBio() {
            if (!confirm('Are you sure you want to delete your profile?')) return

            try {
                // ← correct route for your router
                const resp = await fetch('/profile/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })

                if (resp.ok) {
                    showMessage('Profile deleted.', true)
                    document.getElementById('name').value = ''
                    document.getElementById('email').value = ''
                    document.getElementById('bio').value = ''
                    // Hide delete button after deletion
                    const deleteBtn = document.querySelector('.btn-delete')
                    if (deleteBtn) deleteBtn.style.display = 'none'
                } else {
                    showMessage('Could not delete profile.', false)
                }
            } catch (err) {
                showMessage('Network error.', false)
            }
        }

        function showMessage(text, success) {
            const el = document.getElementById('message')
            el.textContent = text
            el.className = success ? 'success' : 'error'
            el.style.display = 'block'
            setTimeout(() => { el.style.display = 'none' }, 4000)
        }
    </script>
</body>

</html>
