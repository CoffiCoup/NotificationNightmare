<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OHGo! — Login</title>
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* NAVBAR — matches frontPage.html exactly */
    nav {
      background-color: #1c1f81;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: rgb(229, 228, 213);
      font-size: 24px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
    }

    /* MAIN CONTENT AREA — same background as hero */
    main {
      background-color: #f0f0f0;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    /* LOGIN CARD */
    .login-card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }

    .login-card h1 {
      font-size: 26px;
      margin-bottom: 6px;
      color: #1c1f81;
    }

    .login-card p {
      font-size: 14px;
      color: #555;
      margin-bottom: 28px;
    }

    /* FORM FIELDS */
    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    /* Highlight border on focus */
    .field input:focus {
      border-color: #1c1f81;
    }

    /* ERROR / SUCCESS MESSAGE — hidden by default */
    .message {
      display: none;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 5px;
      margin-bottom: 16px;
    }

    .message--error {
      background-color: #fdecea;
      border: 1px solid #f5c6c6;
      color: #c0392b;
    }

    .message--success {
      background-color: #eafaf1;
      border: 1px solid #a9dfbf;
      color: #1e8449;
    }

    /* SUBMIT BUTTON — matches hero button style */
    .btn {
      width: 100%;
      padding: 12px 30px;
      font-size: 16px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }

    .btn:hover {
      background-color: #1c1f81;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* FOOTER — matches frontPage.html exactly */
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR — same as frontPage.html -->
  <nav>
    <div class="logo">OHGo!</div>
    <ul>
      <li><a href="/view/home">Home</a></li>
      <li><a href="/profile/grid/null">Bios</a></li>
      <li><a href="/view/calendar">Calendar</a></li>
      <li><a href="/view/requests">Request</a></li>
      <li><a href="/view/admin">Admins</a></li>
      <li><a href="/view/tas">TAs</a></li>
      <li><a href="/view/about">About</a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <main>
    <div class="login-card">

      <h1>OHGo!</h1>
      <p>Sign in to access your office hours.</p>

      <!-- STATUS BANNER: shown by JavaScript on success or error -->
      <div id="statusMsg" class="message" role="alert"></div>

      <!-- EMAIL FIELD -->
      <div class="field">
        <label for="uidInput">UID</label>
        <input
          type="uid"
          id="uidInput"
          placeholder="Example: abc1de"
          autocomplete="UID"
        />
      </div>

      <!-- PASSWORD FIELD -->
      <div class="field">
        <label for="passwordInput">Password</label>
        <input
          type="password"
          id="passwordInput"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <!-- SUBMIT BUTTON -->
      <button class="btn" id="loginBtn" onclick="handleLogin()">Login</button>

    </div>
  </main>

  <!-- FOOTER  -->
  <footer>
    <p>&copy; 2026 OHGo!. All rights reserved.</p>
  </footer>


    <!-- LOGIN LOGIC -->
   <script>

    //pulls current values out of the UID and Password input fields
    //grabs references to the button and status message div to manipulate later
    async function handleLogin() {
      const uid      = document.getElementById("uidInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const btn      = document.getElementById("loginBtn");
      const msg      = document.getElementById("statusMsg");

      msg.style.display = "none";
      msg.className = "message";
      
      //stops the request early if either field is empty
      if (!uid) {
        showMessage("Please enter your UID.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in…";

      //downloads roleList.json ten searches for an entry where both UID and password match what user typed
      try {

        const resp = await fetch("/admin/getpassword/"+uid)
        const pawd = await resp.text()
        const exists = true
        if (pawd == null || pawd === "") {
          exists = false
        } else if (!(password === pawd)){
          //showMessage("Password is incorrect, please try again", "error");
          return;
        }

        //packages the UID and exists flag into a LoginRequest 
        const loginRequest = {
          uid:    uid,
          exists: exists
        };

        //posts it to Go handler as JSON. 
        //credentials: "include" makes sure the brower sends and receives session cookies
        const loginRes = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(loginRequest),
          credentials: "include"
        });

        //if the Go handler issued a redirect, the browswer follows it
        if (loginRes.redirected) {
          window.location.href = loginRes.url;
          return;
        }

        //if server returned error status, display it
        if (!loginRes.ok) {
          showMessage("Login failed. Please try again.", "error");
          return;
        }

        showMessage("Login successful! Redirecting…", "success");

      } catch (err) {
        console.error("Login error:", err);
        showMessage("Could not reach the server. Please try again.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Login";
      }
    }

    //displays status banner
    function showMessage(text, type) {
      const msg = document.getElementById("statusMsg");
      msg.textContent = text;
      msg.className   = `message message--${type}`;
      msg.style.display = "block";
    }
  </script>


</body>
</html>
