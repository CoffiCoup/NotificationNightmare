<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHGo!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Top bar – logo only */
    .nav-top {
      background-color: #08082b;
      padding: 16px 30px;
      display: flex;
      justify-content: center;
      /* centers horizontally */
      align-items: center;
      /* centers vertically */
    }

    .nav-top .logo {
      color: rgb(229, 228, 213);
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }


    /* Bottom bar – links */
    .nav-bottom {
      background-color: #15151a;
      padding: 12px 30px;
      border-top: 1px solid #ffffff;
    }

    .nav-bottom ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .nav-bottom ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-bottom ul li a:hover {
      color: #08082b;
    }


    /* HERO SECTION */
    .hero {
      flex: 1;
      min-height: 80vh;

      background:
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url("https://www.debevoisedatablog.com/wp-content/uploads/sites/2/2020/10/GettyImages-1166552380-scaled.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      flex-direction: column;
    }

    .hero h1 {
      font-size: 54px;
      color: white;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #e8e8e8;
      margin-bottom: 35px;
    }

    /* Button */
    .hero button {
      padding: 14px 42px;
      font-size: 18px;
      font-weight: bold;
      background-color: #1d3fd6;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .hero button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45);
    }


    /* FOOTER */
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR STUFF -->
  <nav class="navbar">
    <!-- TOP BAR: LOGO ONLY -->
    <div class="nav-top">
      <div class="logo">OHGo!</div>
    </div>


    <!-- BOTTOM BAR: NAV LINKS -->
    <div class="nav-bottom">
      <ul>
        <li><a href="frontPage.html">Home</a></li>
        <li><a href="profiles.html">Bios</a></li>
        <li><a href="calendarPage.html">Calendar</a></li>
        <li><a href="admin.html">Admins</a></li>
        <li><a href="TAs.html">TAs</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
  </nav>


  <!-- HERO SECTION -->
  <div class="hero">
    <h1>Welcome Teacher Assistants!</h1>
    <p>Upload your office hours and bios!</p>
    <a href="OHupload.html"><button>Upload Hours</button></a>

  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 OHGo!. All rights reserved.</p>
  </footer>

</body>

</html>
