<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHGo! - Upload Hours</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f9f9f9;
    }

    /* NAVBAR */
    nav {
      background-color: #1c1f81;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: rgb(229, 228, 213);
      font-size: 24px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
    }

    /* FORM CONTAINER */
    .form-container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      flex: 1;
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #1c1f81;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #1c1f81;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background-color: #333;
    }

    /* FOOTER */
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">OHGo!</div>
    <ul>
      <li><a href="frontPage.html">Home</a></li>
      <li><a href="profiles.html">Bios</a></li>
      <li><a href="calendarPage.html">Calendar</a></li>
      <li><a href="admin.html">Admins</a></li>
      <li><a href="TAs.html">TAs</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <div class="form-container">
    <h2>Upload Office Hours</h2>
    <form id="hoursForm">
      
      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="form-group">
        <label for="time">Start Time</label>
        <input type="time" id="time" name="time" required>
      </div>

       <div class="form-group">
        <label for="time">End Time</label>
        <input type="time" id="time" name="time" required>
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g. Dell 1" required>
      </div>

      <button type="submit" class="submit-btn">Submit Hours</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 OHGo!. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('hoursForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Get values
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const location = document.getElementById('location').value;

      alert(`Office hours submitted for ${date} at ${time} in ${location}!`);
      // Here you would typically send this data to your database (Firebase, SQL, etc.)
    });
  </script>

</body>
</html>
