<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHGo! - Upload Hours</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #08082b;
    }


    /* NAVBAR */
    .navbar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Top bar – logo only */
    .nav-top {
      background-color: #08082b;
      padding: 16px 30px;

      display: flex;
      justify-content: center;
      /* centers horizontally */
      align-items: center;
      /* centers vertically */
    }

    .nav-top .logo {
      color: rgb(229, 228, 213);
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Bottom bar – links */
    .nav-bottom {
      background-color: #15151a;
      padding: 12px 30px;
      border-top: 1px solid #ffffff;
    }

    .nav-bottom ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .nav-bottom ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-bottom ul li a:hover {
      color: #08082b;
    }

    /* FORM CONTAINER */
    .form-container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      flex: 1;
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #1c1f81;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #1c1f81;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background-color: #333;
    }

    /* FOOTER */
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR STUFF -->
  <nav class="navbar">
    <!-- TOP BAR: LOGO ONLY -->
    <div class="nav-top">
      <div class="logo">OHGo!</div>
    </div>


    <!-- BOTTOM BAR: NAV LINKS -->
    <div class="nav-bottom">
      <ul>
        <li><a href="frontPage.html">Home</a></li>
        <li><a href="profiles.html">Bios</a></li>
        <li><a href="calendarPage.html">Calendar</a></li>
        <li><a href="admin.html">Admins</a></li>
        <li><a href="TAs.html">TAs</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
  </nav>

  <div class="form-container">
    <h2>Upload Office Hours</h2>
    <form id="hoursForm">

      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="form-group">
        <label for="time">Start Time</label>
        <input type="time" id="start_time" name="start_time" required>
      </div>

      <div class="form-group">
        <label for="time">End Time</label>
        <input type="time" id="end_time" name="end_time" required>
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g. Dell 1" required>
      </div>

      <button type="submit" class="submit-btn">Submit Hours</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 OHGo!. All rights reserved.</p>
  </footer>

  <script>
    //Finds the form element with id=hoursForm and listens for when the user clicks submit.-->
    document.getElementById('hoursForm').addEventListener('submit', function (e) {
      //Stops the forms default behavior, which would be to reload the page. This lets us handle the submission ourselves with JS instead.-->
      e.preventDefault();

      //Builds a JS object by grabbing the current value of each input field. The key names match the json:"..." tags on OfficeHoursRow so Go can decode it directly.
      const payload = {
        day: document.getElementById('date').value,
        start_time: document.getElementById('start_time').value,
        end_time: document.getElementById('end_time').value,
        location: document.getElementById('location').value,
      };

      //Sends an HTTP POST request to the Go server.
      // JSON.stringify(payload) converts the JS object into a JSON string for the request body. 
      // The Content-Type header tells the server to expect JSON.
      fetch('/oh/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        //.then runs after the server responds. res.ok is true if the server returned a success status code (200–299), so we show a different alert depending on whether it worked.
        .then(res => {
          if (res.ok) alert('Office hours submitted!');
          else alert('Submission failed.');
        })
        //If the request never reaches the server at all (e.g. server is offline, wrong URL), this catches that network error and logs it to the console.
        .catch(err => console.error('Error:', err));
    });
  </script>

</body>

</html>
